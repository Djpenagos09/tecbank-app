<div class="login-container">
  <div class="login-card">
    <div class="brand-header">
      <div class="logo-symbol">T</div>
      <h1>TecBank <span>S.A.</span></h1>
      <p class="tagline">TU FUTURO, NUESTRA PRIORIDAD</p>
    </div>

    <h2>Iniciar Sesión</h2>

    <form class="login-form" (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="username">Nombre de usuario</label>
        <input 
          type="text" 
          id="username" 
          [(ngModel)]="credentials.username" 
          name="username" 
          placeholder="Ingresa tu nombre de usuario" 
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-input-wrapper">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="password" 
            [(ngModel)]="credentials.password" 
            name="password" 
            placeholder="••••••••" 
            required
          >
          <button type="button" class="btn-toggle-pass" (click)="toggleShowPassword()">
            {{ showPassword ? 'Ocultar' : 'Ver' }}
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary">Ingresar</button>
    </form>

    <div class="card-footer">
      <p>¿No tienes una cuenta? <a routerLink="/register" (click)="sound.playClick()">Regístrate aquí</a></p>
    </div>
  </div>
</div>
