<div class="register-container">
  <div class="register-card">
    <div class="brand-header">
      <div class="logo-symbol">T</div>
      <h1>TecBank <span>S.A.</span></h1>
      <p class="tagline">TU FUTURO, NUESTRA PRIORIDAD</p>
    </div>

    <h2>Crear Cuenta</h2>

    <!-- Mensaje de confirmación de registro exitoso -->
    <div *ngIf="successMessage" class="alert-success" style="background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; padding: 12px; border-radius: 6px; margin-bottom: 15px; text-align: center; font-weight: 500;">
      {{ successMessage }}
    </div>

    <!-- Mensaje de error si falla la validación o el backend -->
    <div *ngIf="errorMessage" class="alert-error" style="background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 12px; border-radius: 6px; margin-bottom: 15px; text-align: center; font-weight: 500;">
      {{ errorMessage }}
    </div>

    <form class="register-form" (ngSubmit)="onRegister()">
      <div class="form-group">
        <label for="fullname">Nombre Completo</label>
        <input 
          type="text" 
          id="fullname" 
          [(ngModel)]="user.fullname" 
          name="fullname" 
          placeholder="Ej. Juan Pérez" 
          required
          [disabled]="isSubmitting"
        >
      </div>

      <div class="form-group">
        <label for="username">Nombre de usuario (Seudónimo)</label>
        <input 
          type="text" 
          id="username" 
          [(ngModel)]="user.username" 
          name="username" 
          placeholder="Ej. juanperez99" 
          required
          [disabled]="isSubmitting"
        >
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input 
          type="email" 
          id="email" 
          [(ngModel)]="user.email" 
          name="email" 
          placeholder="ejemplo@correo.com" 
          required
          [disabled]="isSubmitting"
        >
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-input-wrapper">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="password" 
            [(ngModel)]="user.password" 
            name="password" 
            placeholder="••••••••" 
            required
            [disabled]="isSubmitting"
          >
          <button type="button" class="btn-toggle-pass" (click)="toggleShowPassword()">
            {{ showPassword ? 'Ocultar' : 'Ver' }}
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Procesando...' : 'Registrarse' }}
      </button>
    </form>

    <div class="card-footer">
      <p>¿Ya tienes una cuenta? <a routerLink="/login" (click)="sound.playClick()">Inicia sesión</a></p>
    </div>
  </div>
</div>
